[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "orbit-core"
version = "0.1.0"
description = "Headless road-network model, OSM/OpenDRIVE import and OpenDRIVE export, shared by the ORBIT toolchain."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RISE Research Institutes of Sweden" },
]
keywords = ["opendrive", "openstreetmap", "road-network", "asam", "headless"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pyproj>=3.6.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
# Raster export and satellite-tile fetching.
imagery = ["opencv-python>=4.8.0"]
# Oblique-imagery camera model (magnetic declination).
camera = ["geomag>=0.9.2015"]
# XSD validation of exported OpenDRIVE against the ASAM schema.
validation = ["xmlschema>=4.2.0"]
provenance = ["dataprov>=3.0"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "pytest-mock>=3.11.0", "ruff>=0.8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
